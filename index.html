<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To do list</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <div class="container">
        <h1 class="text-center mt-5 mb-4">📝 Todo List</h1>

        <input id="input" class="px-3 w-100 mb-3 fs-6" type="text" placeholder="Enter a task ">
        <button id="btn">Add Task</button>
        <button id="dlt-btn">Delete Task</button>
        
        <ul class="list-container" id="list-container"></ul>
        <p class="hint">
            💡 Tip: Press <b>Enter</b> to add • Press <b>Delete</b> to remove last task</p>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
